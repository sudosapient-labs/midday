name: midday-local

x-common-environment: &common-environment
  NODE_ENV: production
  DATABASE_PRIMARY_URL: postgresql://postgres:postgres@db:5432/postgres
  DATABASE_PRIMARY_POOLER_URL: postgresql://postgres:postgres@db:5432/postgres
  DATABASE_SESSION_POOLER: postgresql://postgres:postgres@db:5432/postgres
  DATABASE_SSL_DISABLED: "true"
  REDIS_URL: redis://redis:6379
  REDIS_QUEUE_URL: redis://redis:6379
  SUPABASE_URL: http://kong:8000
  SUPABASE_INTERNAL_URL: http://kong:8000
  SUPABASE_AUTH_ISSUER: http://127.0.0.1:54321/auth/v1
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  R2_ENDPOINT: http://kong:8000/storage/v1/s3
  R2_BUCKET_NAME: apps
  API_INTERNAL_URL: http://api:8080
  NEXT_PUBLIC_API_URL: http://localhost:3003

services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aof-load-truncated
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - supabase

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.compose.local
    environment:
      <<: *common-environment
      PORT: "8080"
      LOG_LEVEL: debug
      LOG_PRETTY: "true"
      ALLOWED_API_ORIGINS: http://localhost:3001
      MIDDAY_DASHBOARD_URL: http://localhost:3001
      MIDDAY_API_URL: http://localhost:3003
    ports:
      - "3003:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - supabase

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env.compose.local
    environment:
      <<: *common-environment
      PORT: "8080"
      WORKER_ENV: development
      INSIGHTS_ENABLED: "false"
      DISABLE_UPCOMING_NOTIFICATIONS: "true"
      DISABLE_RECURRING_INVOICES: "true"
      MIDDAY_DASHBOARD_URL: http://localhost:3001
      MIDDAY_API_URL: http://localhost:3003
    ports:
      - "3004:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - supabase

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_URL: http://localhost:3001
        NEXT_PUBLIC_API_URL: http://localhost:3003
        NEXT_PUBLIC_DISCORD_CHANNEL_URL: ${NEXT_PUBLIC_DISCORD_CHANNEL_URL:-}
        NEXT_PUBLIC_DESKTOP_SCHEME: midday-dev
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    env_file:
      - .env.compose.local
    environment:
      <<: *common-environment
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3003
      NEXT_PUBLIC_DISCORD_CHANNEL_URL: ${NEXT_PUBLIC_DISCORD_CHANNEL_URL:-}
      NEXT_PUBLIC_DESKTOP_SCHEME: midday-dev
      DEPLOYMENT_MODE: company
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://dashboard:3000/api/health');process.exit(r.ok?0:1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - supabase

volumes:
  redis-data:

networks:
  supabase:
    external: true
    name: supabase_network_midday-mod
